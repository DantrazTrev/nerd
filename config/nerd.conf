# NERD Configuration File
# Network-Flow Editor Production Configuration

[network]
# Network interface to use for flow circulation
interface = eth0

# Packets per second to maintain flow
circulation_rate = 10

# Maximum age of packets in seconds
max_packet_age = 30

# Heartbeat interval in seconds
heartbeat_interval = 5

# Network port for flow communication
port = 31337

# Enable automatic flow discovery
auto_discovery = true

# Enable packet encryption (requires auth_key)
enable_encryption = false

# Maximum packet size in bytes
max_packet_size = 1400

# Buffer size for network operations
buffer_size = 65536

# Number of worker threads
worker_threads = 4

[security]
# Require authentication for flows
require_auth = false

# Authentication key (if require_auth is true)
# auth_key = your-secret-key-here

# Enable TLS encryption
enable_tls = false

# TLS certificate file (if enable_tls is true)
# cert_file = /etc/nerd/cert.pem

# TLS key file (if enable_tls is true)
# key_file = /etc/nerd/key.pem

# Allowed IP addresses (one per line)
# allowed_ip = 192.168.1.100
# allowed_ip = 192.168.1.101

# Blocked IP addresses (one per line)
# blocked_ip = 10.0.0.1

[storage]
# Enable persistent storage of flows
enable_persistence = true

# Directory for persistent data
data_dir = /var/lib/nerd

# Maximum cache size in MB
max_cache_size = 100

# Enable compression for stored data
enable_compression = true

[logging]
# Log file location
log_file = /var/log/nerd.log

# Log level (0=DEBUG, 1=INFO, 2=WARNING, 3=ERROR, 4=CRITICAL)
log_level = 1

# Log to console
log_to_console = true

# Log to file
log_to_file = true

# Maximum log file size in MB
max_log_size = 100

# Maximum number of rotated log files
max_log_files = 10